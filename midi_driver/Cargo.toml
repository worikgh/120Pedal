[package]
name = "midi_driver"
version = "0.1.0"
edition = "2021"

[[bin]]
## Read a MIDI device and output the triples
name = "read_midi"
path = "src/midi_read.rs"

[[bin]]
## Read the tripples and translate them
name = "translate_midi"
path = "src/translate.rs"

[[bin]]
## Run programmes in response to MIDI signals on stdin
name = "command_midi"
path="src/midi_command.rs"

[[bin]]
## Edit Jackd pipes in response to MIDI signals on stdin
name = "jack_midi"
path="src/midi_jack.rs"

[[bin]]
## Dump midi as text
name = "dump_midi"
path="src/midi_dump.rs"

[dependencies]
alsa = "0.7.0"
clap = "4.5.35"
fs2 = "0.4.3"
jack = "0.11.4"
midir = "0.9.1"
serde = { version = "1.0", features = ["derive"] }  # ← Note the "derive" feature
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.3"
